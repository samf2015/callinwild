# Builds the site and publishes the finished files to the `deploy` branch.
# Plesk (cw.iomad.com → Git) pulls that branch into httpdocs; a GitHub webhook tells Plesk to pull straight away.
# No FTP is needed, so the server's firewall can stay closed.
#
# Runs on every push to main, which includes every Save in the Tina Cloud editor. To redeploy by hand use
# Actions → Deploy to Plesk → Run workflow (re-running an old run repeats that commit's old workflow).
#
# Repository secret (Settings → Secrets and variables → Actions → Secrets):
#   TINA_TOKEN   Tina Cloud read-only token (app.tina.io → project → Tokens)

name: Deploy to Plesk

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # to update the deploy branch

# Only one deploy at a time
concurrency:
  group: deploy-plesk
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Build (Tina Cloud + Astro)
        run: npm run build
        env:
          TINA_TOKEN: ${{ secrets.TINA_TOKEN }}
          GITHUB_BRANCH: ${{ github.ref_name }}

      # Replace the deploy branch with this build (a single commit, so the branch stays small)
      - name: Publish built site to the deploy branch
        working-directory: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b deploy
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" deploy
