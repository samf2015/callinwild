# Builds the site and publishes the finished files to the `deploy` branch.
# Plesk (cw.iomad.com → Git) pulls that branch into httpdocs; a GitHub webhook tells Plesk to pull straight away.
# No FTP is needed, so the server's firewall can stay closed.
#
# Runs on every push to main, which includes every Save in the Tina Cloud editor, and can be run by hand
# from the Actions tab ("Run workflow").
#
# Repository secret (Settings → Secrets and variables → Actions → Secrets):
#   TINA_TOKEN   Tina Cloud read-only token (app.tina.io → project → Tokens)

name: Deploy to Plesk

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # to update the deploy branch

# Only one deploy at a time
concurrency:
  group: deploy-plesk
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Build (Tina Cloud + Astro)
        run: npm run build
        env:
          TINA_TOKEN: ${{ secrets.TINA_TOKEN }}
          GITHUB_BRANCH: ${{ github.ref_name }}

      - name: Publish built site to the deploy branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: deploy
          publish_dir: ./dist
          force_orphan: true # keep only the latest build, so the branch stays small
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: 'Deploy ${{ github.sha }}'
